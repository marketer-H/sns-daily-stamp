<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNS 도장판</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f0fdf4;
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    /* ── 로딩 ── */
    #loadingScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      gap: 14px;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #d1fae5;
      border-top-color: #16a34a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 온보딩 ── */
    #setupScreen {
      display: none;
      max-width: 360px;
      margin: 40px auto 0;
      background: white;
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 4px 24px rgba(22,163,74,0.13);
      text-align: center;
    }

    #setupScreen h2 { font-size: 1.4rem; font-weight: 900; color: #15803d; margin-bottom: 6px; }
    #setupScreen p  { font-size: 0.82rem; color: #7db88a; margin-bottom: 28px; }

    .setup-label { text-align: left; font-size: 0.8rem; font-weight: 700; color: #15803d; margin-bottom: 6px; }

    .setup-input {
      width: 100%;
      border: 1.8px solid #a7f3d0;
      border-radius: 12px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 16px;
      color: #14532d;
      outline: none;
      margin-bottom: 18px;
      transition: border-color 0.15s;
    }
    .setup-input:focus { border-color: #22c55e; }

    .track-row { display: flex; gap: 8px; margin-bottom: 18px; }

    .track-emoji-input {
      width: 48px;
      flex-shrink: 0;
      text-align: center;
      border: 1.8px solid #a7f3d0;
      border-radius: 12px;
      padding: 10px 4px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }
    .track-emoji-input:focus { border-color: #22c55e; }

    .track-label-input {
      flex: 1;
      min-width: 0;
      border: 1.8px solid #a7f3d0;
      border-radius: 12px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 16px;
      color: #14532d;
      outline: none;
    }
    .track-label-input:focus { border-color: #22c55e; }

    .setup-btn {
      width: 100%;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.15s;
    }
    .setup-btn:hover { background: #15803d; }
    .setup-btn:disabled { opacity: 0.6; cursor: default; }

    .notice-box {
      background: #f0fdf4;
      border: 1.5px solid #a7f3d0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.78rem;
      color: #5d9469;
      margin-bottom: 20px;
      text-align: left;
      line-height: 1.5;
    }

    /* ── 메인 ── */
    #mainScreen { display: none; }

    header {
      text-align: center;
      margin-bottom: 24px;
      position: relative;
      padding-top: 36px;
    }

    header h1 { font-size: 1.4rem; font-weight: 900; color: #15803d; letter-spacing: -0.5px; }
    header p  { margin-top: 6px; font-size: 0.83rem; color: #6b9e75; }

    .settings-btn {
      position: absolute;
      top: 0; right: 0;
      background: #dcfce7;
      border: none;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: #15803d;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
    }
    .settings-btn:hover { background: #bbf7d0; }

    .month-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 20px;
    }

    .month-nav button {
      background: #d1fae5;
      border: none;
      border-radius: 50%;
      width: 34px; height: 34px;
      font-size: 1rem;
      cursor: pointer;
      color: #15803d;
      font-weight: 900;
      transition: background 0.15s;
    }
    .month-nav button:hover { background: #a7f3d0; }

    .month-label { font-size: 1.15rem; font-weight: 900; color: #15803d; min-width: 120px; text-align: center; }

    .legend { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: #5d9469; font-weight: 700; }
    .legend-dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.88rem; }
    .legend-dot.t1 { background: #dcfce7; }
    .legend-dot.t2 { background: #ddf0ff; }

    .stats-bar { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 12px 16px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(22,163,74,0.1);
      flex: 1;
      min-width: 0;
    }
    .stat-card .num { font-size: 1.8rem; font-weight: 900; line-height: 1; }
    .stat-card.t1 .num { color: #16a34a; }
    .stat-card.t2 .num { color: #2563eb; }
    .stat-card.combo .num { color: #db2777; }
    .stat-card .label { font-size: 0.7rem; color: #bbb; margin-top: 4px; font-weight: 700; }

    .calendar-wrap { max-width: 420px; margin: 0 auto; }

    .day-headers { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 8px; }
    .day-header { text-align: center; font-size: 0.72rem; font-weight: 700; color: #93c4a0; padding: 4px 0; }
    .day-header:first-child { color: #db2777; }
    .day-header:last-child  { color: #2563eb; }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }

    .day-cell {
      background: white;
      border-radius: 14px;
      padding: 6px 4px 8px;
      text-align: center;
      box-shadow: 0 1px 6px rgba(22,163,74,0.07);
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .day-cell.empty   { background: transparent; box-shadow: none; }
    .day-cell.today   { border: 2px solid #16a34a; }
    .day-cell.future  { opacity: 0.4; }

    .day-num { font-size: 0.74rem; font-weight: 700; color: #93c4a0; line-height: 1; }
    .day-cell.today .day-num {
      background: #16a34a; color: white;
      width: 20px; height: 20px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.68rem; margin: 0 auto;
    }

    .stamps { display: flex; flex-direction: column; gap: 3px; width: 100%; }

    .stamp-btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      height: 24px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: transform 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stamp-btn:not(.disabled):active { transform: scale(0.86); }
    .stamp-btn.disabled { cursor: default; opacity: 0.55; }

    .stamp-btn.t1      { background: #dcfce7; color: #16a34a; }
    .stamp-btn.t1.done { background: #16a34a; color: white; }
    .stamp-btn.t2      { background: #ddf0ff; color: #2563eb; }
    .stamp-btn.t2.done { background: #2563eb; color: white; }

    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.28); }
      70%  { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
    .stamp-btn.popping { animation: pop 0.32s ease; }

    .encourage { text-align: center; margin-top: 26px; font-size: 1rem; font-weight: 700; color: #16a34a; min-height: 1.5em; }

    .footer-btn {
      display: block;
      margin: 18px auto 0;
      background: none;
      border: 1.5px solid #a7f3d0;
      color: #93c4a0;
      font-size: 0.75rem;
      border-radius: 20px;
      padding: 6px 16px;
      cursor: pointer;
      font-family: inherit;
    }
    .footer-btn:hover { background: #f0fdf4; }

    @media (max-width: 400px) {
      #setupScreen { margin: 20px auto 0; padding: 24px 16px; }
      .calendar-grid { gap: 3px; }
      .day-cell { padding: 4px 2px 6px; min-height: 70px; border-radius: 10px; }
      .stamp-btn { height: 20px; font-size: 0.72rem; border-radius: 6px; }
      .stats-bar { gap: 8px; }
      .stat-card { padding: 10px 8px; }
      .stat-card .num { font-size: 1.4rem; }
      .stat-card .label { font-size: 0.62rem; }
    }
  </style>
</head>
<body>

<div id="loadingScreen">
  <div class="spinner"></div>
  <p style="color:#6b9e75;font-size:0.85rem;font-family:'Noto Sans KR',sans-serif;">불러오는 중...</p>
</div>

<div id="setupScreen">
  <h2>💫 SNS 도장판 만들기</h2>
  <p id="setupDesc">이름이랑 매일 할 것들을 입력해줘!</p>

  <div class="notice-box">
    💡 같은 이름으로 다른 기기에서 접속하면 데이터가 자동으로 연결돼요!
  </div>

  <div class="setup-label">이름 (닉네임)</div>
  <input class="setup-input" id="setupName" placeholder="예: 권동글" maxlength="10">

  <div class="setup-label">매일 할 것 1</div>
  <div class="track-row">
    <input class="track-emoji-input" id="emoji1" value="✍️" maxlength="2">
    <input class="track-label-input" id="label1" value="블로그" placeholder="이름" maxlength="8">
  </div>

  <div class="setup-label">매일 할 것 2</div>
  <div class="track-row">
    <input class="track-emoji-input" id="emoji2" value="🧵" maxlength="2">
    <input class="track-label-input" id="label2" value="스레드" placeholder="이름" maxlength="8">
  </div>

  <button class="setup-btn" id="setupSaveBtn">도장판 만들기 💫</button>

  <div id="confirmBox" style="display:none; margin-top:14px; background:#fff7ed; border:1.5px solid #fed7aa; border-radius:14px; padding:14px; text-align:left;">
    <p style="font-size:0.83rem; color:#92400e; font-weight:700; margin-bottom:10px;">⚠️ 이미 있는 닉네임이에요!<br><span style="font-weight:400;">혹시 내 계정인가요?</span></p>
    <div style="display:flex; gap:8px;">
      <button id="confirmLoad" style="flex:1; padding:9px; border:none; border-radius:10px; background:#16a34a; color:white; font-weight:900; font-family:inherit; font-size:0.82rem; cursor:pointer;">내 계정이에요 ✅</button>
      <button id="confirmNew"  style="flex:1; padding:9px; border:none; border-radius:10px; background:#f3f4f6; color:#374151; font-weight:700; font-family:inherit; font-size:0.82rem; cursor:pointer;">다른 이름 쓸게요</button>
    </div>
  </div>
</div>

<div id="mainScreen">
  <header>
    <h1 id="mainTitle"></h1>
    <p id="mainSubtitle"></p>
    <button class="settings-btn" id="openSettings">⚙️ 설정</button>
  </header>

  <div class="month-nav">
    <button id="prevBtn">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button id="nextBtn">›</button>
  </div>

  <div class="legend" id="legend"></div>
  <div class="stats-bar" id="statsBar"></div>

  <div class="calendar-wrap">
    <div class="day-headers">
      <div class="day-header">일</div><div class="day-header">월</div>
      <div class="day-header">화</div><div class="day-header">수</div>
      <div class="day-header">목</div><div class="day-header">금</div>
      <div class="day-header">토</div>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <div class="encourage" id="encourageMsg"></div>
  <button class="footer-btn" id="resetBtn">이번 달 초기화</button>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDhmUqSIi4djoqP760ukZSW4FG56JXhN6Y",
    authDomain: "sns-stamp.firebaseapp.com",
    projectId: "sns-stamp",
    storageBucket: "sns-stamp.firebasestorage.app",
    messagingSenderId: "282378100270",
    appId: "1:282378100270:web:e53c85de02ce166e5bc9bf",
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  const NAME_KEY = 'sns_stamp_name';

  const today    = new Date();
  let viewYear   = today.getFullYear();
  let viewMonth  = today.getMonth();
  let currentCfg = null;
  let currentName = null;
  let monthCache = {};

  const msgs = [
    '오늘도 한 발짝! 💫', '꾸준함이 최고야! ✨', '잘하고 있어요! 👏',
    '완벽한 하루! 🌟', '대단해! 계속 고고~ 🚀', '두 개 다 완료! 짱👍',
    '이러다 인플루언서 되겠는걸 💚', '오늘도 기록은 계속된다 📝',
    '열심히! 계속해줘 🎯', '멋진 하루였어요 💕', '내일도 파이팅! 💪',
  ];
  function randMsg() { return msgs[Math.floor(Math.random() * msgs.length)]; }

  // ── Firestore helpers ──
  function userDoc(name)       { return db.collection('sns_stamps').doc(name); }
  function monthDoc(name, y, m){ return userDoc(name).collection('months').doc(`${y}_${m+1}`); }

  async function loadMonthData(name, y, m) {
    const k = `${y}_${m+1}`;
    if (monthCache[k] !== undefined) return monthCache[k];
    const snap = await monthDoc(name, y, m).get();
    monthCache[k] = snap.exists ? snap.data() : {};
    return monthCache[k];
  }

  async function toggleStamp(name, y, m, day, tKey) {
    const k = `${y}_${m+1}`;
    if (!monthCache[k]) monthCache[k] = {};
    if (!monthCache[k][day]) monthCache[k][day] = { t1: false, t2: false };
    monthCache[k][day][tKey] = !monthCache[k][day][tKey];
    await monthDoc(name, y, m).set({ [day]: monthCache[k][day] }, { merge: true });
    return monthCache[k][day][tKey];
  }

  // ── UI helpers ──
  function hide(id) { document.getElementById(id).style.display = 'none'; }
  function show(id, display) { document.getElementById(id).style.display = display || 'block'; }

  // ── 설정 화면 ──
  function showSetup(prefill) {
    hide('loadingScreen'); hide('mainScreen');
    show('setupScreen');
    if (prefill) {
      document.getElementById('setupName').value  = prefill.name || '';
      document.getElementById('emoji1').value     = prefill.items?.[0]?.emoji || '✍️';
      document.getElementById('label1').value     = prefill.items?.[0]?.label || '블로그';
      document.getElementById('emoji2').value     = prefill.items?.[1]?.emoji || '🧵';
      document.getElementById('label2').value     = prefill.items?.[1]?.label || '스레드';
    }
  }

  let pendingCfg = null;

  async function createAndEnter(cfg) {
    await userDoc(cfg.name).set({ config: cfg }, { merge: true });
    localStorage.setItem(NAME_KEY, cfg.name);
    monthCache = {};
    currentName = cfg.name;
    showMain(cfg);
  }

  document.getElementById('confirmLoad').addEventListener('click', async () => {
    if (!pendingCfg) return;
    const snap = await userDoc(pendingCfg.name).get();
    const cfg  = (snap.exists && snap.data().config) ? snap.data().config : pendingCfg;
    localStorage.setItem(NAME_KEY, cfg.name);
    monthCache = {};
    currentName = cfg.name;
    showMain(cfg);
  });

  document.getElementById('confirmNew').addEventListener('click', () => {
    pendingCfg = null;
    document.getElementById('confirmBox').style.display = 'none';
    document.getElementById('setupName').value = '';
    document.getElementById('setupName').focus();
  });

  document.getElementById('setupSaveBtn').addEventListener('click', async () => {
    const btn  = document.getElementById('setupSaveBtn');
    const name = document.getElementById('setupName').value.trim();
    if (!name) { document.getElementById('setupName').focus(); return; }

    const e1  = document.getElementById('emoji1').value.trim() || '✍️';
    const l1  = document.getElementById('label1').value.trim() || '항목1';
    const e2  = document.getElementById('emoji2').value.trim() || '🧵';
    const l2  = document.getElementById('label2').value.trim() || '항목2';
    const cfg = { name, items: [{ emoji: e1, label: l1 }, { emoji: e2, label: l2 }] };

    btn.disabled = true;
    btn.textContent = '확인 중...';
    document.getElementById('confirmBox').style.display = 'none';

    try {
      const snap = await userDoc(name).get();
      if (snap.exists && snap.data().config) {
        pendingCfg = cfg;
        document.getElementById('confirmBox').style.display = 'block';
      } else {
        await createAndEnter(cfg);
      }
    } catch (e) {
      console.error(e);
      btn.textContent = '오류 발생 😢';
      setTimeout(() => { btn.textContent = '도장판 만들기 💫'; }, 2000);
    } finally {
      btn.disabled = false;
      if (btn.textContent === '확인 중...') btn.textContent = '도장판 만들기 💫';
    }
  });

  // ── 메인 화면 ──
  function showMain(cfg) {
    currentCfg = cfg;
    hide('loadingScreen'); hide('setupScreen');
    show('mainScreen');
    document.getElementById('mainTitle').textContent    = `${cfg.name}의 SNS 도장판`;
    document.getElementById('mainSubtitle').textContent = `${cfg.items[0].emoji} ${cfg.items[0].label} + ${cfg.items[1].emoji} ${cfg.items[1].label} 매일매일!`;
    buildLegend(cfg);
    buildStats(cfg);
    renderCalendar(cfg);
  }

  function buildLegend(cfg) {
    document.getElementById('legend').innerHTML = cfg.items.map((it, i) => `
      <div class="legend-item">
        <div class="legend-dot t${i+1}">${it.emoji}</div>
        <span>${it.label}</span>
      </div>`).join('');
  }

  function buildStats(cfg) {
    document.getElementById('statsBar').innerHTML = `
      <div class="stat-card t1"><div class="num" id="stat0">-</div><div class="label">${cfg.items[0].label}</div></div>
      <div class="stat-card t2"><div class="num" id="stat1">-</div><div class="label">${cfg.items[1].label}</div></div>
      <div class="stat-card combo"><div class="num" id="statCombo">-</div><div class="label">완벽한 날 💚</div></div>`;
  }

  async function renderCalendar(cfg) {
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    document.getElementById('monthLabel').textContent = `${viewYear}년 ${viewMonth + 1}월`;

    const data        = await loadMonthData(currentName, viewYear, viewMonth);
    const firstDay    = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const isCurMonth  = viewYear === today.getFullYear() && viewMonth === today.getMonth();
    const todayD      = today.getDate();

    for (let i = 0; i < firstDay; i++) {
      const e = document.createElement('div');
      e.className = 'day-cell empty';
      grid.appendChild(e);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const key     = String(d);
      const dayData = data[key] || { t1: false, t2: false };
      const isToday  = isCurMonth && d === todayD;
      const isFuture = isCurMonth
        ? d > todayD
        : (viewYear > today.getFullYear() || (viewYear === today.getFullYear() && viewMonth > today.getMonth()));

      const cell = document.createElement('div');
      cell.className = 'day-cell' + (isToday ? ' today' : '') + (isFuture ? ' future' : '');

      const numEl = document.createElement('div');
      numEl.className = 'day-num';
      if (isToday) {
        Object.assign(numEl.style, {
          background: '#16a34a', color: 'white',
          width: '20px', height: '20px',
          borderRadius: '50%', display: 'flex',
          alignItems: 'center', justifyContent: 'center',
          fontSize: '0.68rem', margin: '0 auto',
        });
      }
      numEl.textContent = d;
      cell.appendChild(numEl);

      const stampsDiv = document.createElement('div');
      stampsDiv.className = 'stamps';

      cfg.items.forEach((item, idx) => {
        const tKey = `t${idx + 1}`;
        const btn  = document.createElement('button');
        btn.className = `stamp-btn t${idx + 1}${dayData[tKey] ? ' done' : ''}${isFuture ? ' disabled' : ''}`;
        btn.textContent = item.emoji;
        btn.title = item.label;

        if (!isFuture) {
          btn.addEventListener('click', async () => {
            const nowOn = await toggleStamp(currentName, viewYear, viewMonth, key, tKey);
            btn.classList.toggle('done', nowOn);
            btn.classList.remove('popping');
            void btn.offsetWidth;
            btn.classList.add('popping');
            btn.addEventListener('animationend', () => btn.classList.remove('popping'), { once: true });
            document.getElementById('encourageMsg').textContent = nowOn ? randMsg() : '';
            updateStats(await loadMonthData(currentName, viewYear, viewMonth));
          });
        }
        stampsDiv.appendChild(btn);
      });

      cell.appendChild(stampsDiv);
      grid.appendChild(cell);
    }

    updateStats(data);
  }

  function updateStats(data) {
    let c = [0, 0, 0];
    Object.values(data).forEach(v => {
      if (v.t1) c[0]++;
      if (v.t2) c[1]++;
      if (v.t1 && v.t2) c[2]++;
    });
    const s0 = document.getElementById('stat0');
    const s1 = document.getElementById('stat1');
    const sc = document.getElementById('statCombo');
    if (s0) s0.textContent = c[0];
    if (s1) s1.textContent = c[1];
    if (sc) sc.textContent = c[2];
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    if (currentCfg) renderCalendar(currentCfg);
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    if (currentCfg) renderCalendar(currentCfg);
  });

  document.getElementById('openSettings').addEventListener('click', () => {
    showSetup(currentCfg);
  });

  document.getElementById('resetBtn').addEventListener('click', async () => {
    if (!confirm(`${viewYear}년 ${viewMonth + 1}월 도장을 모두 지울까요?`)) return;
    const k = `${viewYear}_${viewMonth+1}`;
    monthCache[k] = {};
    await monthDoc(currentName, viewYear, viewMonth).delete();
    renderCalendar(currentCfg);
    document.getElementById('encourageMsg').textContent = '';
  });

  // ── 시작 ──
  async function init() {
    try {
      await auth.signInAnonymously();
      const savedName = localStorage.getItem(NAME_KEY);
      if (savedName) {
        const snap = await userDoc(savedName).get();
        if (snap.exists && snap.data().config) {
          currentName = savedName;
          showMain(snap.data().config);
          return;
        }
      }
      showSetup(savedName ? { name: savedName } : null);
    } catch (e) {
      console.error(e);
      showSetup(null);
    }
  }

  init();
</script>
</body>
</html>
